version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: insureflow-db
    environment:
      POSTGRES_DB: insureflow
      POSTGRES_USER: insureflow_user
      POSTGRES_PASSWORD: your_db_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insureflow_user -d insureflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
